  validated forms from JSON schemas — no manual widget wiring required.
version: 1.0.0
homepage: https://github.com/anaghasmuttinakoppa/flutter-dynamic-form
repository: https://github.com/anaghasmuttinakoppa/flutter-dynamic-form
issue_tracker: https://github.com/anaghasmuttinakoppa/flutter-dynamic-form/issues
documentation: https://github.com/anaghasmuttinakoppa/flutter-dynamic-form#readme
topics:
  - forms
  - json
  - dynamic-forms
  - validation
  - widgets

environment:
